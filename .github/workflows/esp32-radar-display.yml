name: ESP32 radar display firmware

# Builds and tests the ESP32 + small-display firmware in esp32-radar-display/.
# (The Android app has its own workflow: build-apk.yml.)
on:
  push:
    paths:
      - "esp32-radar-display/**"
      - ".github/workflows/esp32-radar-display.yml"
  pull_request:
    paths:
      - "esp32-radar-display/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32-radar-display
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32-radar-display/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.18

      - name: Radar protocol unit tests
        run: pio test -e native

      - name: Build firmware
        # Stamps the build with date + commit; shown at http://<ip>/update and in /status.
        run: |
          export PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"$(date -u +%Y%m%d)-${GITHUB_SHA::7}\\\""
          pio run -e esp32dev

      - name: Create single flashable image (flash at 0x0)
        run: |
          P=~/.platformio/packages
          B=.pio/build/esp32dev
          python $P/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            -o $B/radar-display-merged.bin --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 $P/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-radar-display-firmware
          path: |
            esp32-radar-display/.pio/build/esp32dev/radar-display-merged.bin
            esp32-radar-display/.pio/build/esp32dev/firmware.bin

  # Publishes the browser flasher (esp32-radar-display/web-flasher) with the firmware just
  # built to GitHub Pages. Runs on the default branch, or when started by hand.
  # One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
  pages:
    needs: build
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: esp32-radar-display-firmware
          path: firmware

      - name: Assemble flasher site
        run: |
          mkdir -p site
          cp esp32-radar-display/web-flasher/index.html site/
          cp firmware/radar-display-merged.bin site/
          # ESP Web Tools (Apache-2.0), pinned version, served from this site.
          npm pack esp-web-tools@10.4.0 --silent
          tar xzf esp-web-tools-10.4.0.tgz
          cp -r package/dist/web site/esp-web-tools
          cp package/LICENSE site/esp-web-tools/LICENSE 2>/dev/null || true
          VERSION="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          cat > site/manifest.json <<JSON
          {
            "name": "LD2450 Radar Display",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [{ "path": "radar-display-merged.bin", "offset": 0 }]
              }
            ]
          }
          JSON
          cat site/manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
