; Super Starter (Leagend JS300) battery display
; Board: ESP32-C3 Super Mini   Display: 1.28" round GC9A01 240x240 (SPI)

[env:esp32-c3-super-mini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  ; The Super Mini has native USB: send Serial over the USB-C port.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  h2zero/NimBLE-Arduino@^2.2.1
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit GC9A01A@^1.1.1
