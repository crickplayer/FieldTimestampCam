; ESP32-C3 SuperMini + 1.28" GC9A01 round display: a second, wireless screen for the
; HLK-LD2450 radar. It shows the live data the radar ESP32 (esp32-radar-display/) sends on
; the home network, so the radar ESP32 needs no changes. Wiring: see README.md.

[platformio]
default_envs = c3_supermini

[env:c3_supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
; Reuses the radar data library (LD2450 + JSON) from the radar display project.
lib_extra_dirs = ../esp32-radar-display/lib
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.7.3
build_flags =
    -Wall
    ; The SuperMini's USB-C goes straight to the C3 (no USB-serial chip).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI display settings (instead of editing the library's User_Setup.h) ---
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    ; Display pins (display pin -> C3 GPIO)
    -D TFT_SCLK=4       ; SCL
    -D TFT_MOSI=6       ; SDA
    -D TFT_MISO=-1      ; not used
    -D TFT_DC=5         ; DC
    -D TFT_CS=7         ; CS
    -D TFT_RST=10       ; RST
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
