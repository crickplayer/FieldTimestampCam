; ESP32 + 2.8" ILI9341 display firmware for the HLK-LD2450 radar.
; Board: ESP32-DevKitC-32E (ESP32-WROOM-32E). Wiring: see README.md.

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; The firmware you flash to the ESP32
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Bigger app partition (1.9 MB) for Wi-Fi + TLS + web server; still leaves room for OTA later.
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@2.0.17
    links2004/WebSockets@2.7.3
    knolleary/PubSubClient@2.8
build_flags =
    -Wall
    ; --- TFT_eSPI display settings (instead of editing the library's User_Setup.h) ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; Display pins (display pin -> ESP32 GPIO)
    -D TFT_MOSI=23      ; SDI(MOSI)
    -D TFT_SCLK=18      ; SCK
    -D TFT_MISO=-1      ; SDO(MISO) not connected
    -D TFT_CS=22        ; CS
    -D TFT_DC=21        ; DC
    -D TFT_RST=4        ; RESET
    -D TFT_BL=32        ; LED (backlight)
    -D TFT_BACKLIGHT_ON=HIGH
    ; Fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1   ; touch is intentionally not used

; ---------------------------------------------------------------------------
; Runs the radar-protocol unit tests on your PC (no ESP32 needed):
;   pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_src_filter = -<*>
test_framework = unity
